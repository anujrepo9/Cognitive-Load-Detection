[package]
name    = "cogniload"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri core ───────────────────────────────────────────────────────────────
tauri                     = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell        = "2"   # spawn sidecars (collector + ml_inference) from Rust
tauri-plugin-dialog       = "2"
tauri-plugin-notification = "2"

# NOTE: tauri-plugin-sql was removed on purpose. It pulls in sqlx, whose
# libsqlite3-sys conflicts with rusqlite's ("multiple packages link to native
# library sqlite3") and the build fails. All DB access goes through rusqlite.

# ── Async runtime (timeouts / channels for sidecar IPC) ──────────────────────
tokio = { version = "1", features = ["sync", "time"] }

# ── Database ─────────────────────────────────────────────────────────────────
rusqlite = { version = "0.31", features = ["bundled"] }

# ── Auth / crypto ────────────────────────────────────────────────────────────
jsonwebtoken = "9"
bcrypt       = "0.15"
sha2         = "0.10"   # was missing — auth.rs imports it

# ── Serialization / time ─────────────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
chrono     = { version = "0.4", features = ["serde"] }

# bcrypt at cost 12 takes seconds in an unoptimised debug build
[profile.dev.package.bcrypt]
opt-level = 3

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
