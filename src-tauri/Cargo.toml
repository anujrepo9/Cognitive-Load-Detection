[package]
name    = "cogniload"
version = "1.0.0"
edition = "2021"

[lib]
name         = "cogniload_lib"
crate-type   = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cogniload"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri core ───────────────────────────────────────────────────────────────
tauri          = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell   = "2"          # spawn sidecars (collector + ml)
tauri-plugin-sql     = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog  = "2"          # native file dialogs (optional)
tauri-plugin-notification = "2"     # system tray notifications

# ── Async runtime ────────────────────────────────────────────────────────────
tokio          = { version = "1", features = ["full"] }

# ── Database (SQLite via rusqlite — used in db.rs directly) ──────────────────
rusqlite       = { version = "0.31", features = ["bundled"] }

# ── Auth / crypto ────────────────────────────────────────────────────────────
jsonwebtoken   = "9"
bcrypt         = "0.15"
uuid           = { version = "1", features = ["v4"] }

# ── Serialization ────────────────────────────────────────────────────────────
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"

# ── Utilities ─────────────────────────────────────────────────────────────────
chrono         = { version = "0.4", features = ["serde"] }
anyhow         = "1"
thiserror      = "1"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
strip     = true