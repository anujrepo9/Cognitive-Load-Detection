[package]
name    = "cognitive-load-detection"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = ["tray-icon"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
tokio            = { version = "1", features = ["full"] }

# SQLite
rusqlite         = { version = "0.31", features = ["bundled"] }

# Auth
bcrypt           = "0.15"
jsonwebtoken     = "9"
sha2             = "0.10"
chrono           = { version = "0.4", features = ["serde"] }

# Native input collection (replaces pynput)
rdev             = "0.5"

# ONNX inference (replaces Python ML sidecar)
ort              = { version = "2.0.0-rc.13", features = ["load-dynamic"] }
ndarray          = "0.17"

# Misc
uuid             = { version = "1", features = ["v4"] }
anyhow           = "1"


[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
