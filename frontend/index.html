<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <!--
      Favicons use relative paths so they resolve correctly under both:
        - Vite dev / web deploy  (served from /)
        - Tauri WebView          (served from asset:// or http://localhost)
      Absolute /icons/... paths 404 inside the Tauri WebView.
    -->
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="icon" type="image/png" href="./icons/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="./icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./icons/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Google Fonts — works in browser (web app) and Tauri (CSP already allows
      fonts.googleapis.com + fonts.gstatic.com).

      media="print" onload trick makes this NON-BLOCKING so a slow or failed
      font fetch never causes a white screen. Falls back to system-ui / sans-serif
      while the font loads (or if offline / CSP blocks it in Tauri).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      />
    </noscript>

    <title>CogniLoad · Cognitive Load Detector</title>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
</body>
</html>
